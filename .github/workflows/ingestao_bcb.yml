name: Ingestão BCB - Séries Temporais

on:
  schedule:
    - cron: '0 10 * * 1-5'  # Todo dia útil às 7h (horário de Brasília = 10h UTC)
  workflow_dispatch:         # Permite rodar manualmente também

jobs:
  ingestao:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r SusepDadosAbertos/requirements.txt

      - name: Rodar bot de ingestão
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python SusepDadosAbertos/bot.py